<header class="header">
  <div class="nav-container">
    <div class="nav-left-group">
      <a routerLink="/" (click)="closeMenu()" class="brand-name">Pizzeria</a>
      <a routerLink="/" (click)="closeMenu()" class="logo-link">
        <img src="/logo.png" alt="Pizzeria Logo" class="logo" />
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="desktop-nav">
        <a routerLink="/order" routerLinkActive="active" class="nav-link">Order Pizza</a>
        <a routerLink="/build" routerLinkActive="active" class="nav-link">Build Ur Pizza</a>
      </nav>
    </div>

    <!-- Desktop Action Buttons -->
    <div class="desktop-actions">
      <button (click)="navigateToCart()" class="cart-btn" aria-label="View shopping cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
          class="cart-icon">
          <path
            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.06 1.4-2.54h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
        </svg>
        <span class="cart-text">Shopping Cart</span>
        @if (cartService.totalItemsCount() > 0) {
        <span class="cart-badge">{{ cartService.totalItemsCount() }}</span>
        }
      </button>
    </div>

    <!-- Mobile Hamburger Trigger -->
    <button class="hamburger-btn" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu">
      <span class="hamburger-line line-1" [class.open]="isMenuOpen()"></span>
      <span class="hamburger-line line-2" [class.open]="isMenuOpen()"></span>
      <span class="hamburger-line line-3" [class.open]="isMenuOpen()"></span>
    </button>
  </div>

  <!-- Mobile Collapsible Navigation Drawer -->
  <div class="mobile-nav" [class.open]="isMenuOpen()">
    <nav class="mobile-nav-links">
      <a routerLink="/order" routerLinkActive="active" (click)="closeMenu()" class="mobile-nav-link">
        Order Pizza
      </a>
      <a routerLink="/build" routerLinkActive="active" (click)="closeMenu()" class="mobile-nav-link">
        Build Ur Pizza
      </a>
      <button (click)="navigateToCart()" class="mobile-cart-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
          class="cart-icon">
          <path
            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.06 1.4-2.54h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
        </svg>
        <span>Shopping Cart</span>
        @if (cartService.totalItemsCount() > 0) {
        <span class="cart-badge">{{ cartService.totalItemsCount() }}</span>
        }
      </button>
    </nav>
  </div>
</header>
